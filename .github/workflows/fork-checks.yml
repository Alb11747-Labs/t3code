name: Fork checks

# The release gate from upstream's release.yml (quality, tests, sharded server
# tests) for Alb11747-Labs. Quality, tests and web tests run on the Lazarus
# self-hosted runners (label lazarus-linux) unless the `runner` input or the
# CHECKS_RUNNER repository variable names another label, such as
# blacksmith-8vcpu-ubuntu-2404 or ubuntu-24.04. The server shards run on
# GitHub-hosted runners (CHECKS_SERVER_RUNNER) beside them, because Lazarus
# has the memory for only one job at a time. Lazarus runners have no root,
# so jobs skip the apt steps there (their image has those packages) and use
# the runners' persistent pnpm store instead of restoring the GitHub cache.
# Called by fork-sync.yml before promoting a rebase and by fork-release.yml
# before publishing.

on:
  workflow_call:
    inputs:
      repository:
        default: ${{ github.repository }}
        type: string
      ref:
        required: true
        type: string
      runner:
        default: ""
        type: string

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ${{ inputs.runner || vars.CHECKS_RUNNER || 'lazarus-linux' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: ${{ !startsWith(runner.name, 'lazarus-') }}
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check
        run: vp check

      - name: Typecheck
        run: vp run typecheck

  test:
    name: Tests
    runs-on: ${{ inputs.runner || vars.CHECKS_RUNNER || 'lazarus-linux' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: ${{ !startsWith(runner.name, 'lazarus-') }}
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - uses: ./.github/actions/setup-apt-mirrors
        if: ${{ !startsWith(runner.name, 'lazarus-') }}

      - name: Install browser secret helper build libraries
        if: ${{ !startsWith(runner.name, 'lazarus-') }}
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config build-essential

      - name: Test
        run: vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/monorepo' --filter '!@t3tools/web' test

      - name: Test fork scripts
        if: hashFiles('fork/scripts/*.test.cjs') != ''
        run: node --test 'fork/scripts/*.test.cjs'

  # The web suite gets its own job, as in upstream's ci.yml, so the other
  # packages cannot starve its 30 s import hooks into timeouts.
  test_web:
    name: Web tests
    runs-on: ${{ inputs.runner || vars.CHECKS_RUNNER || 'lazarus-linux' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: ${{ !startsWith(runner.name, 'lazarus-') }}
          run-install: true

      - name: Install Chromium for web browser tests
        run: |
          if [[ -f apps/web/node_modules/playwright/cli.js ]]; then
            node apps/web/node_modules/playwright/cli.js install ${{ !startsWith(runner.name, 'lazarus-') && '--with-deps' || '' }} --only-shell chromium
          fi

      - name: Test
        run: |
          # Upstream's release-link tests expect its repository, not the CI host.
          if [[ ! -f fork/README.md ]]; then
            export T3CODE_DESKTOP_UPDATE_REPOSITORY=pingdotgg/t3code
          fi
          vp run --filter @t3tools/web test

  test_server:
    name: Server tests ${{ matrix.shard }}
    runs-on: ${{ inputs.runner || vars.CHECKS_SERVER_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: ${{ !startsWith(runner.name, 'lazarus-') }}
          run-install: true

      - uses: ./.github/actions/setup-apt-mirrors
        if: ${{ !startsWith(runner.name, 'lazarus-') }}

      - name: Install Chromium for server browser integration tests
        run: node apps/server/node_modules/playwright-core/cli.js install ${{ !startsWith(runner.name, 'lazarus-') && '--with-deps' || '' }} --only-shell chromium

      - name: Test
        run: vp run --filter t3 test --shard ${{ matrix.shard }}/${{ strategy.job-total }}
