name: Fork PR checks

# Runs upstream's release gate (fork-checks.yml) on a branch prepared for an
# upstream pull request. Upstream holds CI on PRs from unvouched contributors
# at "action required" until a maintainer approves the run, so this is the
# fork's own evidence that the branch passes.
#
# Upstream PR branches start from upstream main and don't contain this file,
# so pushes to them can't trigger it. Start it from main instead:
#   gh workflow run fork-pr-checks.yml -R Alb11747-Labs/t3code -f ref=<branch-or-sha>
# Add `-f runner=blacksmith-8vcpu-ubuntu-2404` to run off the Lazarus runners.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit in Alb11747/t3code to check
        required: true
        type: string
      runner:
        description: Runner label for every job (empty uses CHECKS_RUNNER, then lazarus-linux; server shards CHECKS_SERVER_RUNNER, then ubuntu-24.04)
        required: false
        type: string

concurrency:
  group: fork-pr-checks-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/fork-checks.yml
    with:
      repository: Alb11747/t3code
      ref: ${{ inputs.ref }}
      runner: ${{ inputs.runner }}
